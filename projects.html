<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects - Galaxy Dev</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Animated Background Elements -->
<div class="background-animation">
  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>
  <div class="bg-blur blur-3"></div>
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>
  <div class="floating-shape shape-4"></div>
</div>

<!-- Particle Container -->
<div class="particles-container"></div>

<!-- Grid Background -->
<div class="animated-grid"></div>

<header>
  <div class="logo">
    <img src="logo.png" alt="Galaxy Web Logo" class="logo-img">
    <span class="logo-text">GALAXY WEB</span>
  </div>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="skills.html" class="nav-link">Skills</a>
    <a href="projects.html" class="nav-link active">Projects</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </nav>
</header>

<section class="page-content">
  <div class="container">
    <h1>Featured Projects</h1>
    <div class="projects-gallery" id="projects-gallery">
      <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #a855f7;">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
        <p>Loading projects...</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <p>&copy; 2026 GalaxyDev. All rights reserved. | <a href="admin.html" style="color: #a855f7; text-decoration: none;"><i class="fas fa-cog"></i> Admin</a></p>
</footer>

<script src="page-transition.js"></script>
<script>
// Generate animated particles
function createParticles() {
  const container = document.querySelector('.particles-container');
  const particleCount = 30;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    const randomX = Math.random() * window.innerWidth;
    const randomDuration = 8 + Math.random() * 12;
    const randomDelay = Math.random() * 5;
    
    particle.style.left = randomX + 'px';
    particle.style.top = window.innerHeight + 'px';
    particle.style.animationDuration = randomDuration + 's';
    particle.style.animationDelay = randomDelay + 's';
    
    const colors = [
      'rgba(168, 85, 247, 0.6)',
      'rgba(236, 72, 153, 0.5)',
      'rgba(59, 130, 246, 0.5)',
      'rgba(168, 85, 247, 0.4)'
    ];
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    
    container.appendChild(particle);
  }
}

window.addEventListener('load', createParticles);

async function loadProjects() {
  const gallery = document.getElementById('projects-gallery');
  try {
    let projects = null;
    
    // Check local storage sync first
    const cachedProjects = localStorage.getItem('galaxy_projects');
    if (cachedProjects) {
      try {
        projects = JSON.parse(cachedProjects);
      } catch (e) {
        console.warn('Failed to parse cached galaxy_projects', e);
      }
    }
    
    // Fallback to projects.json
    if (!projects || !Array.isArray(projects) || projects.length === 0) {
      const response = await fetch('projects.json');
      if (!response.ok) throw new Error('Failed to load projects list');
      projects = await response.json();
    }
    
    gallery.innerHTML = '';
    
    if (!projects || projects.length === 0) {
      gallery.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #a855f7;">
        <p>No projects found. Add some from the admin panel!</p>
      </div>`;
      return;
    }
    
    projects.forEach(project => {
      const item = document.createElement('div');
      item.className = 'project-item';
      
      const desc = document.createElement('div');
      desc.className = 'project-description';
      desc.textContent = project.title;
      item.appendChild(desc);
      
      const mediaSrc = encodeURI(project.src);
      
      if (project.type === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'metadata';
        video.playsInline = true;
        video.src = mediaSrc; // Direct src assignment ensures reliable HTML5 video loading
        
        const source = document.createElement('source');
        source.src = mediaSrc;
        source.type = 'video/mp4';
        
        video.appendChild(source);
        
        video.onerror = () => {
          console.error('Failed to load video:', project.src);
          const errOverlay = document.createElement('div');
          errOverlay.style.cssText = 'position: absolute; bottom: 10px; left: 10px; right: 10px; color: #f87171; font-size: 0.8rem; background: rgba(0,0,0,0.8); padding: 5px; border-radius: 4px; z-index: 5; text-align: center;';
          errOverlay.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Video media unavailable (${project.src})`;
          item.appendChild(errOverlay);
        };
        
        item.appendChild(video);
        try { video.load(); } catch (e) {}
      } else {
        const img = document.createElement('img');
        img.src = mediaSrc;
        img.alt = project.title;
        img.loading = 'lazy';
        img.onerror = () => {
          img.style.display = 'none';
          const errOverlay = document.createElement('div');
          errOverlay.style.cssText = 'height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.9rem; flex-direction: column; gap: 8px;';
          errOverlay.innerHTML = `<i class="fas fa-image" style="font-size: 2rem; color: #a855f7;"></i><span>${project.title}</span>`;
          item.appendChild(errOverlay);
        };
        item.appendChild(img);
      }
      
      gallery.appendChild(item);
    });
  } catch (err) {
    console.error(err);
    gallery.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ec4899;">
      <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 15px;"></i>
      <p>Failed to load projects. Please try again later.</p>
    </div>`;
  }
}

window.addEventListener('DOMContentLoaded', loadProjects);

setInterval(() => {
  const container = document.querySelector('.particles-container');
  const particleCount = container.children.length;
  
  if (particleCount < 50) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    const randomX = Math.random() * window.innerWidth;
    const randomDuration = 8 + Math.random() * 12;
    
    particle.style.left = randomX + 'px';
    particle.style.top = window.innerHeight + 'px';
    particle.style.animationDuration = randomDuration + 's';
    
    const colors = [
      'rgba(168, 85, 247, 0.6)',
      'rgba(236, 72, 153, 0.5)',
      'rgba(59, 130, 246, 0.5)',
      'rgba(168, 85, 247, 0.4)'
    ];
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    
    container.appendChild(particle);
    
    setTimeout(() => {
      particle.remove();
    }, randomDuration * 1000);
  }
}, 300);

// Enhanced scroll animations
const observerOptions = {
  threshold: 0.1,
  rootMargin: '0px 0px -50px 0px'
};

const observer = new IntersectionObserver(function(entries) {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      entry.target.style.animation = entry.target.classList[0] + ' 0.8s ease-out forwards';
    }
  });
}, observerOptions);

document.querySelectorAll('.fade-in-up, .fade-in-left, .fade-in-right').forEach(el => {
  observer.observe(el);
});

// Mouse tracking effect for elements
document.addEventListener('mousemove', (e) => {
  const cards = document.querySelectorAll('.skill-card, .project-item');
  
  cards.forEach(card => {
    const rect = card.getBoundingClientRect();
    const cardCenterX = rect.left + rect.width / 2;
    const cardCenterY = rect.top + rect.height / 2;
    
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    const distX = mouseX - cardCenterX;
    const distY = mouseY - cardCenterY;
    
    const distance = Math.sqrt(distX * distX + distY * distY);
    
    if (distance < 300) {
      const strength = (300 - distance) / 300;
      const moveX = (distX / distance) * strength * 5;
      const moveY = (distY / distance) * strength * 5;
      
      card.style.transform = `translateX(${moveX}px) translateY(${moveY}px)`;
    } else {
      card.style.transform = 'translateX(0) translateY(0)';
    }
  });
});
</script>
</body>
</html>
